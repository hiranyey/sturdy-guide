<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f1222" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Hexbound — a pocket-sized AI-driven hex RPG you play five minutes at a time." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <title>Hexbound</title>
  </head>
  <body>
    <div id="app">
      <header id="hud"></header>
      <main id="map-wrap"><canvas id="map" role="application" aria-label="World map. Tap a glowing hex to move, press and hold a hex for details, drag to look around, pinch to zoom."></canvas><div id="map-ui"></div></main>
      <footer id="dock"></footer>
    </div>
    <div id="screen" class="screen"></div>
    <div id="overlay"></div>
    <div class="rotate-note" role="alert"><div class="rn-icon">📱</div><b>Turn your phone upright</b><span>Hexbound is designed for portrait play.</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
